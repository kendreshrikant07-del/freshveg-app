<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register - FreshVeg</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: linear-gradient(135deg, #0f2818 0%, #1a4a2e 50%, #0e3320 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-container { width: 100%; max-width: 460px; }
    .auth-brand { text-align: center; margin-bottom: 32px; color: white; }
    .auth-brand .logo { font-size: 48px; display: block; margin-bottom: 8px; }
    .auth-brand h1 { font-size: 28px; font-weight: 900; }
    .auth-brand p { opacity: 0.8; font-size: 14px; margin-top: 4px; }
    .auth-card { background: white; border-radius: var(--radius-xl); padding: 36px; box-shadow: var(--shadow-xl); }
    .auth-tabs { display: flex; gap: 0; margin-bottom: 28px; border-bottom: 2px solid var(--border); }
    .auth-tab { flex: 1; padding: 10px; text-align: center; font-weight: 700; font-size: 15px; cursor: pointer; border: none; background: none; color: var(--text-secondary); transition: var(--transition); border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .password-wrapper { position: relative; }
    .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px; color: var(--text-secondary); }
    .auth-footer { text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 20px; }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .demo-accounts { background: var(--primary-pale); border-radius: var(--radius); padding: 12px 16px; margin-top: 20px; font-size: 13px; }
    .demo-accounts strong { color: var(--primary-dark); display: block; margin-bottom: 6px; }
    .demo-btn { background: white; border: 1px solid var(--primary); color: var(--primary); padding: 4px 10px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; margin: 3px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-brand">
      <span class="logo">🥦</span>
      <h1>FreshVeg</h1>
      <p>Farm fresh vegetables at your doorstep</p>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" onclick="showTab('login')">Login</button>
        <button class="auth-tab" id="registerTab" onclick="showTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <div id="loginForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="toggle-password" onclick="togglePwd('loginPassword', this)">👁️</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="loginBtn" onclick="handleLogin()">Login</button>
        <div class="demo-accounts">
          <strong>🎭 Demo Accounts (click to fill):</strong>
          <button class="demo-btn" onclick="fillDemo('admin@freshveg.com','admin123')">Admin</button>
          <button class="demo-btn" onclick="fillDemo('user@freshveg.com','user123')">Customer</button>
        </div>
      </div>

      <!-- Register Form -->
      <div id="registerForm" style="display:none">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="regName" placeholder="Your full name" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="regEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-input" id="regPhone" placeholder="10-digit mobile number">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-input" id="regPassword" placeholder="Min 6 characters" autocomplete="new-password">
            <button type="button" class="toggle-password" onclick="togglePwd('regPassword', this)">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-input" id="regConfirm" placeholder="Confirm your password" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="registerBtn" onclick="handleRegister()">Create Account</button>
      </div>

      <div class="auth-footer">
        <a href="index.html">← Back to Home</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script>
    const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || 'index.html';

    // Check if already logged in
    if (localStorage.getItem('fv_token') && localStorage.getItem('fv_user')) {
      window.location.href = redirectUrl;
    }

    function showTab(tab) {
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('loginTab').classList.toggle('active', tab === 'login');
      document.getElementById('registerTab').classList.toggle('active', tab === 'register');
    }

    function togglePwd(inputId, btn) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? '👁️' : '🙈';
    }

    function fillDemo(email, pwd) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pwd;
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) return showToast('Please enter email and password', 'error');

      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '⏳ Logging in...';

      const { ok, data } = await api.post('/auth/login', { email, password });
      btn.disabled = false; btn.textContent = 'Login';

      if (ok && data.success) {
        localStorage.setItem('fv_token', data.token);
        localStorage.setItem('fv_user', JSON.stringify(data.user));
        showToast(`Welcome back, ${data.user.name}! 🌱`, 'success');
        setTimeout(() => window.location.href = redirectUrl, 800);
      } else {
        showToast(data.message || 'Login failed', 'error');
      }
    }

    async function handleRegister() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;

      if (!name || !email || !password) return showToast('Please fill all required fields', 'error');
      if (password !== confirm) return showToast('Passwords do not match', 'error');
      if (password.length < 6) return showToast('Password must be at least 6 characters', 'error');

      const btn = document.getElementById('registerBtn');
      btn.disabled = true; btn.textContent = '⏳ Creating Account...';

      const { ok, data } = await api.post('/auth/register', { name, email, phone, password });
      btn.disabled = false; btn.textContent = 'Create Account';

      if (ok && data.success) {
        localStorage.setItem('fv_token', data.token);
        localStorage.setItem('fv_user', JSON.stringify(data.user));
        showToast(`Welcome to FreshVeg, ${data.user.name}! 🎉`, 'success');
        setTimeout(() => window.location.href = redirectUrl, 800);
      } else {
        showToast(data.message || 'Registration failed', 'error');
      }
    }

    // Enter key support
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('loginForm').style.display !== 'none') handleLogin();
        else handleRegister();
      }
    });
  </script>
</body>
</html>
