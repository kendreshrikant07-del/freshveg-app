<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - FreshVeg</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 360px; gap: 24px; padding: 32px 0; align-items: start; }
    .cart-item { background: white; border-radius: var(--radius-lg); padding: 20px; margin-bottom: 12px; display: flex; gap: 16px; align-items: center; box-shadow: var(--shadow-sm); transition: var(--transition); }
    .cart-item:hover { box-shadow: var(--shadow-md); }
    .cart-item-emoji { font-size: 56px; min-width: 72px; height: 72px; background: var(--primary-pale); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .cart-item-unit { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    .cart-item-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .qty-ctrl { display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 6px 12px; border-radius: var(--radius); }
    .qty-ctrl-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: white; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .qty-ctrl-val { font-size: 15px; font-weight: 700; min-width: 24px; text-align: center; }
    .cart-item-price { text-align: right; }
    .cart-item-total { font-size: 18px; font-weight: 800; color: var(--primary-dark); }
    .cart-item-each { font-size: 12px; color: var(--text-muted); }
    .remove-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 4px; transition: var(--transition); }
    .remove-btn:hover { color: var(--error); }
    .order-summary { background: white; border-radius: var(--radius-xl); padding: 24px; box-shadow: var(--shadow-sm); position: sticky; top: 140px; }
    .summary-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-light); font-size: 14px; }
    .summary-row:last-of-type { border: none; }
    .summary-total { font-size: 18px; font-weight: 800; color: var(--primary-dark); }
    .coupon-row { display: flex; gap: 8px; margin: 16px 0; }
    .coupon-input { flex: 1; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; text-transform: uppercase; }
    .coupon-input:focus { border-color: var(--primary); }
    .savings-badge { background: #dcfce7; color: #16a34a; padding: 10px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .free-delivery-bar { background: var(--primary-pale); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.5s ease; }
    @media (max-width: 900px) { .cart-layout { grid-template-columns: 1fr; } .order-summary { position: static; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand"><span class="brand-icon">🥦</span><span class="brand-name">FreshVeg</span></a>
      <div class="nav-actions">
        <a href="products.html" class="nav-link">🛍️ Continue Shopping</a>
        <a href="cart.html" class="nav-link cart-link">🛒 Cart<span class="cart-badge" id="cartBadge" style="display:none">0</span></a>
        <div class="nav-user" id="navUser">
          <a href="auth.html" class="btn btn-primary btn-sm" id="loginBtn">Login</a>
          <div class="user-dropdown" id="userDropdown" style="display:none">
            <button class="user-avatar" id="userAvatarBtn"><span id="userInitial">U</span></button>
            <div class="dropdown-menu" id="dropdownMenu">
              <div class="dropdown-header"><strong id="dropdownName">User</strong><small id="dropdownEmail"></small></div>
              <a href="orders.html" class="dropdown-item">📦 My Orders</a>
              <hr><button class="dropdown-item logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="delivery-bar"><div class="delivery-container"><span class="delivery-info">📍 Mumbai - 400001</span></div></div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1>🛒 Your Cart</h1>
      <p id="cartSubtitle">Loading your items...</p>
    </div>
  </div>

  <div class="container">
    <div class="cart-layout">
      <div>
        <div id="cartItems">
          <div class="skeleton-card" style="height:100px;margin-bottom:12px"></div>
          <div class="skeleton-card" style="height:100px;margin-bottom:12px"></div>
          <div class="skeleton-card" style="height:100px"></div>
        </div>
      </div>

      <div class="order-summary">
        <div class="summary-title">🧾 Order Summary</div>
        <div id="freeDBar" class="free-delivery-bar" style="display:none">
          <span id="freeDMsg">Add ₹500 more for free delivery</span>
          <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
        <div id="savingsBadge" class="savings-badge" style="display:none">🎉 You save <strong id="savingsAmount">₹0</strong>!</div>
        <div class="summary-row"><span>Subtotal</span><span id="summarySubtotal">₹0</span></div>
        <div class="summary-row"><span>Delivery Fee</span><span id="summaryDelivery">₹40</span></div>
        <div class="summary-row" id="discountRow" style="display:none"><span>Discount</span><span id="summaryDiscount" style="color:var(--success)">-₹0</span></div>
        <div class="summary-row" style="padding-top:16px">
          <strong>Total</strong><span class="summary-total" id="summaryTotal">₹0</span>
        </div>
        <div class="coupon-row">
          <input type="text" class="coupon-input" id="couponInput" placeholder="COUPON CODE">
          <button class="btn btn-outline btn-sm" onclick="applyCoupon()">Apply</button>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:16px">Try: FRESH10, NEWUSER, FLAT50</div>
        <button class="btn btn-primary btn-block btn-lg" onclick="proceedToCheckout()">Proceed to Checkout →</button>
        <a href="products.html" style="display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--text-secondary)">← Continue Shopping</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    let cartData = null;
    let appliedCoupon = null;
    let couponDiscount = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!isLoggedIn()) {
        document.getElementById('cartItems').innerHTML = `<div class="empty-state"><div class="empty-icon">🔐</div><h3 class="empty-title">Please Login</h3><p class="empty-desc">Login to view your cart</p><a href="auth.html?redirect=cart.html" class="btn btn-primary">Login / Register</a></div>`;
        document.getElementById('cartSubtitle').textContent = 'Login to view your cart';
        return;
      }
      await loadCart();
    });

    async function loadCart() {
      const { ok, data } = await api.get('/cart');
      if (!ok) { showToast('Failed to load cart', 'error'); return; }
      cartData = data;
      renderCart(data);
    }

    function renderCart(data) {
      const { items, summary } = data;
      document.getElementById('cartSubtitle').textContent = `${summary.item_count} items in your cart`;
      updateCartBadge(summary.item_count);

      if (!items.length) {
        document.getElementById('cartItems').innerHTML = `<div class="empty-state"><div class="empty-icon">🛒</div><h3 class="empty-title">Your cart is empty</h3><p class="empty-desc">Add some fresh vegetables to get started!</p><a href="products.html" class="btn btn-primary btn-lg">Browse Products</a></div>`;
        updateSummary(summary);
        return;
      }

      document.getElementById('cartItems').innerHTML = items.map(item => `
        <div class="cart-item" id="ci-${item.product_id}">
          <div class="cart-item-emoji">${getVeggieEmoji(item.name)}</div>
          <div class="cart-item-info">
            <div class="cart-item-name"><a href="product.html?slug=${item.slug}" style="color:inherit">${item.name}</a></div>
            <div class="cart-item-unit">Per ${item.unit} • ${formatCurrency(item.price)} each</div>
            <div class="cart-item-controls">
              <div class="qty-ctrl">
                <button class="qty-ctrl-btn" onclick="updateQty('${item.product_id}', ${item.quantity - 1})">−</button>
                <span class="qty-ctrl-val" id="qty-${item.product_id}">${item.quantity}</span>
                <button class="qty-ctrl-btn" onclick="updateQty('${item.product_id}', ${item.quantity + 1})">+</button>
              </div>
              <button class="remove-btn" onclick="removeItem('${item.product_id}')" title="Remove">🗑️ Remove</button>
            </div>
          </div>
          <div class="cart-item-price">
            <div class="cart-item-total">${formatCurrency(item.price * item.quantity)}</div>
            ${item.mrp > item.price ? `<div class="cart-item-each" style="text-decoration:line-through">${formatCurrency(item.mrp * item.quantity)}</div>` : ''}
          </div>
        </div>
      `).join('');

      updateSummary(summary);
    }

    function updateSummary(summary) {
      const total = (summary.subtotal || 0) - couponDiscount;
      document.getElementById('summarySubtotal').textContent = formatCurrency(summary.subtotal || 0);
      document.getElementById('summaryDelivery').textContent = summary.delivery_fee === 0 ? '🎉 FREE' : formatCurrency(summary.delivery_fee || 40);
      document.getElementById('summaryTotal').textContent = formatCurrency(total + (summary.delivery_fee || 0));
      if (summary.savings > 0) {
        document.getElementById('savingsBadge').style.display = 'flex';
        document.getElementById('savingsAmount').textContent = formatCurrency(summary.savings);
      }
      // Free delivery progress
      const subtotal = summary.subtotal || 0;
      if (subtotal < 500 && subtotal > 0) {
        document.getElementById('freeDBar').style.display = 'block';
        const pct = (subtotal / 500) * 100;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('freeDMsg').textContent = `Add ${formatCurrency(500 - subtotal)} more for free delivery`;
      } else if (subtotal >= 500) {
        document.getElementById('freeDBar').innerHTML = '<span style="color:var(--primary-dark);font-weight:600">🎉 You have FREE delivery!</span>';
        document.getElementById('freeDBar').style.display = 'block';
      }
      if (couponDiscount > 0) {
        document.getElementById('discountRow').style.display = 'flex';
        document.getElementById('summaryDiscount').textContent = `-${formatCurrency(couponDiscount)}`;
      }
    }

    async function updateQty(productId, newQty) {
      if (newQty <= 0) return removeItem(productId);
      const { ok, data } = await api.put('/cart/update', { product_id: productId, quantity: newQty });
      if (ok && data.success) {
        document.getElementById(`qty-${productId}`).textContent = newQty;
        await loadCart();
      } else showToast(data.message || 'Update failed', 'error');
    }

    async function removeItem(productId) {
      const el = document.getElementById(`ci-${productId}`);
      if (el) { el.style.opacity = '0.5'; el.style.pointerEvents = 'none'; }
      const { ok } = await api.delete(`/cart/remove/${productId}`);
      if (ok) { showToast('Item removed', 'info'); await loadCart(); }
      else { if (el) { el.style.opacity = '1'; el.style.pointerEvents = ''; } showToast('Failed to remove', 'error'); }
    }

    async function applyCoupon() {
      const code = document.getElementById('couponInput').value.trim().toUpperCase();
      if (!code) return showToast('Enter a coupon code', 'warning');
      const { ok, data } = await api.post('/cart/apply-coupon', { code, subtotal: cartData?.summary?.subtotal || 0 });
      if (ok && data.success) {
        appliedCoupon = code;
        couponDiscount = data.discount;
        showToast(`🎉 Coupon applied! Saved ${formatCurrency(data.discount)}`, 'success');
        updateSummary(cartData.summary);
      } else showToast(data.message || 'Invalid coupon', 'error');
    }

    function proceedToCheckout() {
      if (!cartData?.items?.length) return showToast('Your cart is empty', 'warning');
      const params = new URLSearchParams();
      if (appliedCoupon) params.set('coupon', appliedCoupon);
      window.location.href = `checkout.html?${params}`;
    }
  </script>
</body>
</html>
